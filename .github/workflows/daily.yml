name: Daily WeChat News

on:
  schedule:
    # 每天 UTC 01:00 运行，即北京时间 09:00
    - cron: "0 1 * * *"

  # 允许手动启动，方便测试
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily news
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python main.py
